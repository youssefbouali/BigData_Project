version: '3.8'

networks:
  default:
    name: bigdata-net
    driver: bridge

services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_AUTO_BOOTSTRAP=false
      - CASSANDRA_CLUSTER_NAME=NetFlow Cluster
      - CASSANDRA_LISTEN_ADDRESS=cassandra
      - CASSANDRA_BROADCAST_ADDRESS=cassandra
      - CASSANDRA_RPC_ADDRESS=cassandra
      - CASSANDRA_SEEDS=cassandra
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./docker/cassandra/init.cql:/init.cql
    command: cassandra -f -R
    networks:
      - default


  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    command: /start-master.sh
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./model:/model
    networks:
      - default

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    command: /start-worker.sh spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    networks:
      - default

  spark-submit:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    depends_on:
      - spark-master
      - cassandra
#      - kafka
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./model:/model
    networks:
      - default

